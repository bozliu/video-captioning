name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest black ruff

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Unit tests
        run: pytest -q -k "not integration"

      - name: CLI smoke
        run: |
          python -m videocap.train --help
          python -m videocap.evaluate --help
          python -m videocap.predict --help
          python -m videocap.prepare_data --help
